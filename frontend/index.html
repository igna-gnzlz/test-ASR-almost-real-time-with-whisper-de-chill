<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WhisperX MVP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin: 30px 0;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        #status {
            margin-bottom: 20px;
            font-weight: bold;
        }

        #audioContainer {
            margin-top: 30px;
        }
        #transcription {
            width: 100%;
            height: 300px;
            box-sizing: border-box;
            padding: 15px;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            overflow-y: auto;
        }
    </style>
</head>

<body>

    <h1>WhisperX Test</h1>

    <p id="status">Estado: detenido</p>

    <div class="controls">
        <button id="startButton">
            Comenzar
        </button>

        <button id="stopButton" disabled>
            Finalizar
        </button>
    </div>
    <textarea
    id="transcription"
    placeholder="La transcripción aparecerá aquí..."
    readonly>
    </textarea>

    <div id="audioContainer"></div>

<script src="index.js"></script>
</body>
</html>
